name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-3-dev libgtksourceview-4-dev libvte-2.91-dev xvfb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config gtk+3 gtksourceview4 vte3

      - name: Build (-Wall -Wextra -Werror)
        run: make WERROR=1

      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a make check
          xvfb-run -a make test
          xvfb-run -a ./Photon --run --screenshot photon-run-${{ matrix.os }}.png tests/samples/hello.py
          xvfb-run -a ./Photon --screenshot photon-${{ matrix.os }}.png tests/samples/hello.lunar

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          make check
          make test
          ./Photon --run --screenshot photon-run-${{ matrix.os }}.png tests/samples/hello.py
          ./Photon --screenshot photon-${{ matrix.os }}.png tests/samples/hello.lunar

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: photon-*.png
          if-no-files-found: ignore
